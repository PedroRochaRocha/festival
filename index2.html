<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto_9_Rocha_Pedro</title>
  <link rel="shortcut icon" href="img/icono-estrella.png" type="image/x-icon">
  <style>
    /* Fondo general en azul cielo muy suave */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #eaf6ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    /* Tarjeta del formulario en blanco con borde azul claro */
    .contenedor-formulario {
      background: #ffffff;
      padding: 30px 35px;
      border-radius: 20px;
      border: 2px solid #bae1ff;
      box-shadow: 0 8px 20px rgba(56, 152, 236, 0.12);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      margin-top: 0;
      color: #1a5b96;
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .campo {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #2c6ca8;
      font-size: 14px;
    }

    /* Campos de texto redondeados en tonos azul claro */
    input[type="text"],
    input[type="email"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 12px 16px;
      background-color: #f4faff;
      border: 1.5px solid #a8d5ff;
      border-radius: 15px;
      box-sizing: border-box;
      font-family: inherit;
      color: #1b4965;
      transition: all 0.3s ease;
    }

    /* Efecto al hacer clic en los campos */
    input:focus,
    textarea:focus {
      outline: none;
      background-color: #ffffff;
      border-color: #3898ec;
      box-shadow: 0 0 0 3px rgba(56, 152, 236, 0.2);
    }

    /* Contenedor de opciones radio */
    .opciones-radio {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    /* Botones radio estilizados como etiquetas redondeadas */
    .opciones-radio label {
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      background-color: #f0f8ff;
      padding: 10px 15px;
      border-radius: 50px; /* Completamente redondeado */
      border: 1px solid #cce6ff;
      color: #1a5b96;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .opciones-radio label:hover {
      background-color: #dcf0ff;
      border-color: #7cc0ff;
    }

    input[type="radio"] {
      accent-color: #2b8be6;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Botón principal completamente redondeado en azul claro vibrante */
    .btn-3 {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #56b4ff, #2b8be6);
      color: white;
      border: none;
      border-radius: 50px; /* Forma de píldora redondeada */
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(43, 139, 230, 0.3);
      transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
    }

    .btn-3:hover {
      background: linear-gradient(135deg, #42a5f5, #1e78d6);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(43, 139, 230, 0.4);
    }

    .btn-3:active {
      transform: translateY(0);
    }

    #mensaje-estado {
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="contenedor-formulario">
    <h2>Califique su experiencia</h2>
    
    <!-- Tu formulario con la URL de Formspree -->
    <form id="formulario-satisfaccion" action="https://formspree.io/f/xbgojgqe" method="POST">
      
      <!-- Nombre -->
      <div class="campo">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre completo" required>
      </div>

      <!-- Correo Electrónico -->
      <div class="campo">
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" placeholder="Escribe Tu Correo Aqui" required>
      </div>

      <!-- Fecha -->
      <div class="campo">
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha" required>
      </div>

      <!-- Botones Radio (Satisfacción) -->
      <div class="campo">
        <label>¿Nuestra pagina fue de utilidad para usted?</label>
        <div class="opciones-radio">
          <label>
            <input type="radio" name="satisfaccion" value="Muy satisfecho" required>
            Demasiado 
          </label>
          <label>
            <input type="radio" name="satisfaccion" value="Satisfecho">
            No era lo que esperaba, pero me sirvio
          </label>
          <label>
            <input type="radio" name="satisfaccion" value="Insatisfecho">
            No me sirvio para nada
          </label>
        </div>
      </div>

      <!-- Caja de mensajes -->
      <div class="campo">
        <label for="mensaje">Motivo de su consulta:</label>
        <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe aquí el motivo de tu consulta..." required></textarea>
      </div>

      <!-- Botón de envío -->
      <button type="submit" class="btn-3" value="Enviar">Enviar</button>

      <!-- Mensaje de confirmación -->
      <p id="mensaje-estado"></p>
    </form>
  </div>

  <!-- Script para enviar el formulario y borrar todos los campos automáticamente -->
  <script>
    const form = document.getElementById("formulario-satisfaccion");
    const estado = document.getElementById("mensaje-estado");

    form.addEventListener("submit", async function(event) {
      event.preventDefault(); 
      
      const datos = new FormData(form);
      estado.style.color = "#2c6ca8";
      estado.textContent = "Enviando respuesta...";

      try {
        const respuesta = await fetch(form.action, {
          method: form.method,
          body: datos,
          headers: {
            'Accept': 'application/json'
          }
        });

        if (respuesta.ok) {
          estado.style.color = "#0d8a55";
          estado.textContent = "¡Gracias! Tu calificación ha sido enviada.";
          form.reset(); // Borra todos los campos automáticamente
        } else {
          estado.style.color = "#d9383a";
          estado.textContent = "Hubo un problema al enviar el formulario. Intenta de nuevo.";
        }
      } catch (error) {
        estado.style.color = "#d9383a";
        estado.textContent = "Error de conexión. Verifica tu internet.";
      }
    });
  </script>

</body>
</html>
